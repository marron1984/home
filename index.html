<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Star Catcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell" aria-labelledby="game-title">
      <section class="hero-panel">
        <p class="eyebrow">Mini Browser Game</p>
        <h1 id="game-title">Star Catcher</h1>
        <p class="lead">
          30秒以内に落ちてくる星をキャッチしよう。爆弾に触れるとスコアが減ります。
        </p>
      </section>

      <section class="hud" aria-label="ゲーム情報">
        <div>
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span>Time</span>
          <strong id="time">30</strong>
        </div>
        <button id="start-button" type="button">スタート</button>
      </section>

      <section class="game-area" id="game-area" aria-label="ゲームエリア" tabindex="0">
        <div class="player" id="player" aria-label="プレイヤーのバスケット"></div>
        <div class="message" id="message">
          <strong>遊び方</strong>
          <span>← → キー、または A / D キーでバスケットを動かします。</span>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
