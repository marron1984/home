<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cosmic Shooter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell" aria-labelledby="game-title">
      <section class="hero-panel">
        <p class="eyebrow">Vertical Scrolling Shooter</p>
        <h1 id="game-title">Cosmic Shooter</h1>
        <p class="lead">
          宇宙船を左右に動かし、レーザーで迫りくる隕石と敵機を撃ち落とそう。
          ライフがなくなる前にハイスコアを目指してください。
        </p>
      </section>

      <section class="hud" aria-label="ゲーム情報">
        <div>
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span>Lives</span>
          <strong id="lives">3</strong>
        </div>
        <div>
          <span>Time</span>
          <strong id="time">45</strong>
        </div>
        <button id="start-button" type="button">スタート</button>
      </section>

      <section class="game-area" id="game-area" aria-label="ゲームエリア" tabindex="0">
        <div class="starfield" aria-hidden="true"></div>
        <div class="player" id="player" aria-label="プレイヤーの宇宙船"></div>
        <div class="message" id="message">
          <strong>遊び方</strong>
          <span>← → / A D で移動、スペースキーでレーザーを発射します。</span>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
